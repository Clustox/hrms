# SonarQube configuration for the hrms Frappe app.
# Consumed by the sonar-scanner CLI in the "SonarQube Analysis" stage of the Jenkinsfile.
# sonar.projectVersion is supplied by the pipeline (-Dsonar.projectVersion=$GIT_COMMIT).

sonar.projectKey=hrms
sonar.projectName=hrms
sonar.sourceEncoding=UTF-8

# Python app code plus the two Vue frontends. frappe-ui is an uninitialised submodule.
sonar.sources=hrms,frontend/src,roster/src

# Frappe interleaves tests with app code (test_*.py next to each doctype), so tests
# share a root with sources: they are excluded from main below and re-picked up here.
sonar.tests=hrms
sonar.test.inclusions=**/test_*.py,**/tests/**/*.py

sonar.exclusions=\
  **/test_*.py,\
  **/tests/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/__pycache__/**,\
  **/*.min.js,\
  hrms/public/dist/**,\
  hrms/locale/**,\
  frappe-ui/**

sonar.python.version=3.10,3.11,3.12
